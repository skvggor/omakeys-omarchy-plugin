name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance to mint an OIDC token
  # for signing the build provenance against Sigstore.
  id-token: write
  # Required by actions/attest-build-provenance to persist the attestation
  # through the repository attestations API.
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs so mutable tags cannot silently change what
      # builds the released artifact.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Verify versions match tag
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$manifest_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "version mismatch: tag v$tag_version, manifest.json $manifest_version, Cargo.toml $cargo_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      # The daemon links against the system libxkbcommon, so the release uses
      # the default glibc target (a fully static musl build would break that).
      - name: Build the daemon
        run: cargo build --release --bin omakeys-daemon

      - name: Stage release assets
        run: |
          asset="omakeys-daemon-x86_64-linux-gnu"
          cp target/release/omakeys-daemon "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: omakeys-daemon-x86_64-linux-gnu

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          printf '%s\n' \
            '## What'"'"'s Changed' '' \
            'See the tags and commit history for details.' '' \
            '**Full Changelog**: https://github.com/'"$GITHUB_REPOSITORY"'/compare/'"$previous_tag"'...'"$GITHUB_REF_NAME" \
            > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            omakeys-daemon-x86_64-linux-gnu \
            omakeys-daemon-x86_64-linux-gnu.sha256

      # Fail the workflow if a published asset or its signed attestation is
      # missing, instead of letting the broken release reach users.
      - name: Verify published release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset="omakeys-daemon-x86_64-linux-gnu"
          staged="$asset"
          base="https://github.com/skvggor/omakeys-omarchy-plugin/releases/download/$tag"

          ASSET_CURL_OPTS=(--fail --location --retry 5 --retry-delay 2
            --connect-timeout 10 --max-time 30 --max-filesize 1048576
            --silent --show-error)

          for url in "$base/$asset" "$base/$asset.sha256"; do
            curl "${ASSET_CURL_OPTS[@]}" --head -o /dev/null "$url"
            echo "asset published: $url"
          done

          digest="sha256:$(sha256sum "$staged" | cut -d' ' -f1)"
          attestation_file="$(mktemp)"
          trap 'rm -f "$attestation_file"' EXIT

          ATTEST_CURL_OPTS=(--fail --location --retry 5 --retry-delay 2
            --connect-timeout 5 --max-time 20 --max-filesize 1048576
            --silent --show-error)

          curl "${ATTEST_CURL_OPTS[@]}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: omakeys-release" \
            "https://api.github.com/repos/skvggor/omakeys-omarchy-plugin/attestations/$digest" \
            -o "$attestation_file"

          # Strict provenance check mirrors the installer's verify_attestation():
          # predicateType, subject digest, repository, buildType and source commit must all match.
          sha256="${digest#sha256:}"
          expected_repo="https://github.com/skvggor/omakeys-omarchy-plugin"
          expected_commit="$(git rev-parse HEAD)"
          jq -e --arg sha256 "$sha256" --arg repo "$expected_repo" --arg commit "$expected_commit" '
            .attestations[0].bundle.dsseEnvelope.payload
            | @base64d | fromjson
            | select(.predicateType == "https://slsa.dev/provenance/v1")
            | select(.subject[0].digest.sha256 == $sha256)
            | select(.predicate.buildDefinition.externalParameters.workflow.repository == $repo)
            | select(.predicate.buildDefinition.buildType == "https://actions.github.io/buildtypes/workflow/v1")
            | select(.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit == $commit)
          ' "$attestation_file" >/dev/null
          echo "attestation served: $digest (provenance for $expected_commit)"
