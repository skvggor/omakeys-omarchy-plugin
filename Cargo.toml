[package]
name = "omakeys-daemon"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "evdev keyboard and mouse listener daemon for the OmaKeys Omarchy plugin"

[dependencies]
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xkbcommon = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
